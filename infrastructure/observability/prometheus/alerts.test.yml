# promtool test rules alerts.test.yml — every alert fires on the situation it describes and
# stays quiet on normal traffic.
rule_files: [alerts.yml]
evaluation_interval: 1m

tests:
  - name: 5xx above 5% for 10 minutes pages; healthy traffic does not
    interval: 1m
    input_series:
      # order-service: 10 req/s, 1 req/s fail (10%)
      - series: 'http_server_request_duration_seconds_count{job="order-service",http_response_status_code="200"}'
        values: '0+540x30'
      - series: 'http_server_request_duration_seconds_count{job="order-service",http_response_status_code="500"}'
        values: '0+60x30'
      # cart-service: healthy
      - series: 'http_server_request_duration_seconds_count{job="cart-service",http_response_status_code="200"}'
        values: '0+600x30'
    alert_rule_test:
      - eval_time: 8m
        alertname: HighErrorRate
        exp_alerts: []
      - eval_time: 20m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels: { job: order-service, severity: critical }
            exp_annotations:
              summary: 'order-service: 10% of requests fail with 5xx'
              runbook_url: https://github.com/CiupituStefan/Market-place/blob/main/docs/runbooks.md#higherrorrate

  - name: a few errors on almost no traffic do not page
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="review-service",http_response_status_code="500"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: HighErrorRate
        exp_alerts: []

  - name: p95 above one second
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{job="product-service",le="0.5"}'
        values: '0+0x30'
      - series: 'http_server_request_duration_seconds_bucket{job="product-service",le="2"}'
        values: '0+600x30'
      - series: 'http_server_request_duration_seconds_bucket{job="product-service",le="+Inf"}'
        values: '0+600x30'
      - series: 'http_server_request_duration_seconds_count{job="product-service"}'
        values: '0+600x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HighLatency
        exp_alerts:
          - exp_labels: { job: product-service, severity: warning }
            exp_annotations:
              summary: 'product-service: p95 latency 1.925s'
              runbook_url: https://github.com/CiupituStefan/Market-place/blob/main/docs/runbooks.md#highlatency

  - name: a service that stops reporting
    interval: 1m
    input_series:
      - series: 'target_info{job="payment-service",instance="a"}'
        values: '1x70 _x60'
      - series: 'target_info{job="cart-service",instance="b"}'
        values: '1x130'
    alert_rule_test:
      - eval_time: 65m
        alertname: ServiceSilent
        exp_alerts: []
      - eval_time: 85m
        alertname: ServiceSilent
        exp_alerts:
          - exp_labels: { job: payment-service, severity: critical }
            exp_annotations:
              summary: payment-service stopped reporting
              runbook_url: https://github.com/CiupituStefan/Market-place/blob/main/docs/runbooks.md#servicesilent

  - name: a dead-lettered event warns at once
    interval: 1m
    input_series:
      - series: 'cse_events_dead_lettered_total{job="notification-service",topic="orders.events"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: EventsDeadLettered
        exp_alerts:
          - exp_labels: { job: notification-service, topic: orders.events, severity: warning }
            exp_annotations:
              summary: 'notification-service: 1 event(s) from orders.events dead-lettered'
              runbook_url: https://github.com/CiupituStefan/Market-place/blob/main/docs/runbooks.md#eventsdeadlettered

  - name: payment failures need both a high ratio and real volume
    interval: 1m
    input_series:
      - series: 'cse_payments_total{outcome="failed"}'
        values: '0+2x40'
      - series: 'cse_payments_total{outcome="succeeded"}'
        values: '0+2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentFailureSpike
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: '50% of payment attempts fail'
              runbook_url: https://github.com/CiupituStefan/Market-place/blob/main/docs/runbooks.md#paymentfailurespike

  - name: refused checkouts are business as usual, unexpected ones page
    interval: 1m
    input_series:
      - series: 'cse_checkouts_failed_total{reason="INSUFFICIENT_STOCK"}'
        values: '0+5x20'
      - series: 'cse_checkouts_failed_total{reason="SERVICE_UNAVAILABLE"}'
        values: '0 0 1 2 3 4 4 4'
    alert_rule_test:
      - eval_time: 7m
        alertname: CheckoutsFailing
        exp_alerts:
          - exp_labels: { reason: SERVICE_UNAVAILABLE, severity: critical }
            exp_annotations:
              summary: '4 checkouts failed with SERVICE_UNAVAILABLE in 10 minutes'
              runbook_url: https://github.com/CiupituStefan/Market-place/blob/main/docs/runbooks.md#checkoutsfailing
