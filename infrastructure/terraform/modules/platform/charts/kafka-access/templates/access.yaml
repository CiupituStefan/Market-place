{{- range $key := list "region" "roleArn" "adminSecretName" "bootstrapBrokers" "revision" }}
{{- if not (index $.Values $key) }}{{ fail (printf "%s is required" $key) }}{{ end }}
{{- end }}
{{- if not .Values.dataCidrs }}{{ fail "dataCidrs must list the brokers' subnets" }}{{ end }}
# The only identity that can read the admin credentials (IRSA); used by the SecretStore below,
# never mounted into a pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-access
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kafka-admin
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: kafka-access
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kafka-admin
  target:
    name: kafka-admin
  data:
    - secretKey: KAFKA_ADMIN_USERNAME
      remoteRef: { key: {{ .Values.adminSecretName | quote }}, property: username }
    - secretKey: KAFKA_ADMIN_PASSWORD
      remoteRef: { key: {{ .Values.adminSecretName | quote }}, property: password }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-access-{{ .Values.revision | trunc 12 }}
data:
  {{- range $name, $content := .Values.files }}
  {{- if not $content }}{{ fail (printf "files.%s is empty" $name) }}{{ end }}
  {{ $name }}: {{ $content | quote }}
  {{- end }}
---
# One Job per revision of the access files; Helm (wait_for_jobs) waits for it to succeed.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-access-{{ .Values.revision | trunc 12 }}
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-access
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: apply
          image: {{ .Values.image | quote }}
          command: [bash, /access/apply.sh]
          env:
            - { name: KAFKA_BOOTSTRAP, value: {{ .Values.bootstrapBrokers | quote }} }
            - { name: KAFKA_SECURITY_PROTOCOL, value: SASL_SSL }
            - { name: KAFKA_ACCESS_DIR, value: /access }
            - { name: KAFKA_HEAP_OPTS, value: -Xmx256m }
            - { name: LOG_DIR, value: /tmp/logs }
          envFrom:
            - secretRef: { name: kafka-admin }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: access, mountPath: /access, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: access
          configMap:
            name: kafka-access-{{ .Values.revision | trunc 12 }}
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-access
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        {{- range .Values.dataCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 9096 }
