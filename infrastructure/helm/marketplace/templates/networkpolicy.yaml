{{- /*
Default deny, both directions, for every pod of the release; then allow-lists per component.
Ingress: the load balancer reaches web and api-gateway only; services accept calls from the
components in their `allowFrom`.
Egress (global.networkPolicy.egress): DNS; the components it is allowed to call (the reverse of
their allowFrom, on their port only); the data stores in the data subnets, per need (PostgreSQL
for `database`, Redis for `redis`, Kafka for services with the shared settings); the
OpenTelemetry collector; and HTTPS to the internet only for `internetEgress` components (AWS
APIs, Stripe, the image CDN), never to the VPC or the instance metadata service. A compromised
pod cannot scan the cluster or reach another service's database.
*/}}
{{- if .Values.global.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: cse-keyboards
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress{{ if .Values.global.networkPolicy.egress }}, Egress{{ end }}]
{{- range $name, $c := .Values.components }}
{{- $ctx := dict "name" $name "root" $ }}
{{- if or $c.allowFrom $c.public }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-ingress
  labels:
    {{- include "marketplace.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marketplace.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- range $caller := $c.allowFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $caller }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- end }}
        {{- if $c.public }}
        {{- range $cidr := $.Values.global.ingress.loadBalancerCidrs }}
        - ipBlock:
            cidr: {{ $cidr }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
{{- if .Values.global.networkPolicy.egress }}
{{- $np := .Values.global.networkPolicy }}
{{- if not $np.dataCidrs }}
{{- fail "global.networkPolicy.dataCidrs is required with egress policies (data subnets)" }}
{{- end }}
{{- $data := $np.dataCidrs }}
{{- range $name, $c := .Values.components }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-egress
  labels:
    {{- include "marketplace.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marketplace.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- range $target, $t := $.Values.components }}
    {{- if has $name ($t.allowFrom | default list) }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $target }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - { port: {{ $t.port }}, protocol: TCP }
    {{- end }}
    {{- end }}
    {{- $ports := list }}
    {{- if $c.database }}{{ $ports = append $ports 5432 }}{{ end }}
    {{- if $c.redis }}{{ $ports = append $ports 6379 }}{{ end }}
    {{- if eq (include "marketplace.enabled" $c.sharedEnv) "true" }}{{ $ports = append $ports 9096 }}{{ end }}
    {{- if $ports }}
    - to:
        {{- range $cidr := $data }}
        - ipBlock: { cidr: {{ $cidr }} }
        {{- end }}
      ports:
        {{- range $port := $ports }}
        - { port: {{ $port }}, protocol: TCP }
        {{- end }}
    {{- end }}
    {{- if $.Values.global.telemetry.endpoint }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $np.collectorNamespace }} }
      ports:
        - { port: 4318, protocol: TCP }
    {{- end }}
    {{- if $c.internetEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $cidr := $np.vpcCidrs }}
              - {{ $cidr }}
              {{- end }}
              - 169.254.169.254/32
      ports:
        - { port: 443, protocol: TCP }
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
