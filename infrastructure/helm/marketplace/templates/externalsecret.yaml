{{- /*
Secret references: each component's secrets live in AWS Secrets Manager as one JSON object at
<keyPrefix>/<component>; External Secrets copies its keys into the Kubernetes Secret
<component>-secrets. With externalSecrets.enabled=false that Secret must exist already.
Expected keys: DATABASE_URL and DATABASE_MIGRATION_URL (services with a database),
KAFKA_SASL_USERNAME/KAFKA_SASL_PASSWORD (all services), plus JWT_PRIVATE_KEY (auth),
STRIPE_SECRET_KEY/STRIPE_PUBLISHABLE_KEY/STRIPE_WEBHOOK_SECRET (payment),
UNSUBSCRIBE_SECRET (notification), REDIS_URL (gateway).
Credentials that Terraform generates are read from their own entries instead, so nobody copies
them by hand: with kafkaSecretPrefix set, KAFKA_SASL_USERNAME/PASSWORD come from the MSK SCRAM
secret <kafkaSecretPrefix><component>; with redisSecretKey set, REDIS_URL comes from that entry
for components marked `redis: true`. Those keys then must not be in the component's own entry.
*/}}
{{- if .Values.global.externalSecrets.enabled }}
{{- range $name, $c := .Values.components }}
{{- if eq (include "marketplace.enabled" $c.secrets) "true" }}
{{- $ctx := dict "name" $name "root" $ }}
{{- $es := $.Values.global.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "marketplace.secretName" $ctx }}
  labels:
    {{- include "marketplace.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeRef.name }}
    kind: {{ $es.storeRef.kind }}
  target:
    name: {{ include "marketplace.secretName" $ctx }}
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- $redis := and $es.redisSecretKey $c.redis }}
  {{- if or $es.kafkaSecretPrefix $redis }}
  data:
    {{- if $es.kafkaSecretPrefix }}
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef: { key: {{ printf "%s%s" $es.kafkaSecretPrefix $name | quote }}, property: username }
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef: { key: {{ printf "%s%s" $es.kafkaSecretPrefix $name | quote }}, property: password }
    {{- end }}
    {{- if $redis }}
    - secretKey: REDIS_URL
      remoteRef: { key: {{ $es.redisSecretKey | quote }}, property: url }
    {{- end }}
  {{- end }}
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $es.keyPrefix $name }}
{{- end }}
{{- end }}
{{- end }}
