{{- /*
One identity per component, with no Kubernetes API permissions (no Role or RoleBinding):
the services never talk to the API server. AWS access, where needed, is an IRSA role.
*/}}
{{- range $name, $c := .Values.components }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "marketplace.labels" $ctx | nindent 4 }}
  {{- if $c.iamRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $c.iamRoleArn | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
