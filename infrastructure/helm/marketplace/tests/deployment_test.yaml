suite: deployments
templates:
  - deployment.yaml
  - configmap.yaml
  - rds-ca.yaml
values:
  - ../values-production.yaml
  - ../ci/example-values.yaml
tests:
  - it: tags images with the Git SHA from the ECR registry
    template: deployment.yaml
    documentSelector: { path: metadata.name, value: order-service }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/cse/order-service:3f9c2e1

  - it: runs the web image built for this environment
    template: deployment.yaml
    documentSelector: { path: metadata.name, value: web }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/cse/web:3f9c2e1-production

  # The values schema rejects `latest` before rendering; the template check is the second
  # line of defence (any capitalisation, or --skip-schema-validation).
  - it: refuses latest
    template: deployment.yaml
    set: { global.image.tag: Latest }
    asserts:
      - failedTemplate:
          errorMessage: global.image.tag must be an immutable Git SHA, never latest

  - it: refuses a missing tag
    template: deployment.yaml
    set: { global.image.tag: '' }
    asserts:
      - failedTemplate:
          errorMessage: global.image.tag is required (the Git SHA of the build)

  - it: migrates with the schema owner's credentials before serving
    template: deployment.yaml
    documentSelector: { path: metadata.name, value: order-service }
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [node, dist/db/migrate-cli.js]
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef: { name: order-service-secrets, key: DATABASE_MIGRATION_URL }

  - it: verifies the database certificate against the RDS roots, in both containers
    template: deployment.yaml
    documentSelector: { path: metadata.name, value: order-service }
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: rds-ca, configMap: { name: rds-ca } }
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content: { name: rds-ca, mountPath: /etc/ssl/rds, readOnly: true }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: rds-ca, mountPath: /etc/ssl/rds, readOnly: true }

  - it: ships the RDS root certificates
    template: rds-ca.yaml
    asserts:
      - matchRegex: { path: 'data["ca.pem"]', pattern: 'BEGIN CERTIFICATE' }

  - it: runs the web app without migrations or secrets
    template: deployment.yaml
    documentSelector: { path: metadata.name, value: web }
    asserts:
      - notExists: { path: spec.template.spec.initContainers }
      - lengthEqual: { path: 'spec.template.spec.containers[0].envFrom', count: 1 }
      - notContains:
          path: spec.template.spec.volumes
          content: { name: rds-ca, configMap: { name: rds-ca } }
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/health

  - it: hardens every pod
    template: deployment.yaml
    documentSelector: { path: metadata.name, value: payment-service }
    asserts:
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal:
          { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }
      - equal:
          {
            path: 'spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem',
            value: true,
          }
      - equal:
          {
            path: 'spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation',
            value: false,
          }
      - equal:
          {
            path: 'spec.template.spec.containers[0].securityContext.capabilities.drop',
            value: [ALL],
          }
      - equal: { path: spec.strategy.rollingUpdate.maxUnavailable, value: 0 }
      - equal:
          {
            path: 'spec.template.spec.containers[0].livenessProbe.httpGet.path',
            value: /health/live,
          }
      - equal:
          {
            path: 'spec.template.spec.containers[0].readinessProbe.httpGet.path',
            value: /health/ready,
          }
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: payment-service-secrets

  - it: lets the HPA own the replica count
    template: deployment.yaml
    documentSelector: { path: metadata.name, value: api-gateway }
    asserts:
      - notExists: { path: spec.replicas }

  - it: derives public URLs from the domains and keeps secrets out of ConfigMaps
    template: configmap.yaml
    documentSelector: { path: metadata.name, value: api-gateway-config }
    asserts:
      - equal: { path: data.CORS_ORIGINS, value: https://www.csekeyboards.com }
      - equal: { path: data.DOCS_ENABLED, value: 'false' }
      - notExists: { path: data.REDIS_URL }
      - notExists: { path: data.DATABASE_URL }

  - it: gives the web app only what it needs
    template: configmap.yaml
    documentSelector: { path: metadata.name, value: web-config }
    asserts:
      - equal: { path: data.API_INTERNAL_URL, value: http://api-gateway:4000 }
      - notExists: { path: data.KAFKA_BROKERS }

  - it: sends every component's telemetry to the collector, named and versioned
    template: configmap.yaml
    documentSelector: { path: metadata.name, value: order-service-config }
    asserts:
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability.svc.cluster.local:4318
      - equal: { path: data.OTEL_SERVICE_NAME, value: order-service }
      - equal: { path: data.SERVICE_VERSION, value: 3f9c2e1 }
      - equal: { path: data.DEPLOYMENT_ENVIRONMENT, value: production }
      - equal: { path: data.OTEL_TRACES_SAMPLER, value: parentbased_traceidratio }
      - equal: { path: data.OTEL_TRACES_SAMPLER_ARG, value: '0.25' }

  - it: instruments the web app too, although it gets no shared settings
    template: configmap.yaml
    documentSelector: { path: metadata.name, value: web-config }
    asserts:
      - equal: { path: data.OTEL_SERVICE_NAME, value: web }
      - notExists: { path: data.KAFKA_BROKERS }

  - it: turns telemetry off with an empty endpoint
    template: configmap.yaml
    documentSelector: { path: metadata.name, value: order-service-config }
    set: { global.telemetry.endpoint: '' }
    asserts:
      - notExists: { path: data.OTEL_EXPORTER_OTLP_ENDPOINT }
