name: OpenSSF Scorecard

# Independent supply-chain audit of the repository (branch protection, pinned dependencies,
# token permissions, code review, signed releases, ...). Results go to the Security tab and to
# the public Scorecard API (badge in the README). Kept to the steps Scorecard allows when
# publishing results: no other actions, no top-level env or defaults.

on:
  branch_protection_rule:
  schedule:
    - cron: '29 5 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # results to code scanning
      id-token: write # publish results (signed) to the Scorecard API
      contents: read # read the repository
      actions: read # read workflow runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
