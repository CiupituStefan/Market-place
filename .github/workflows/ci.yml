name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # checkout only: CI never writes to the repository or reaches AWS

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same versions as docker-compose.yml, pinned by digest.
    services:
      # Real PostgreSQL to prove the committed migrations apply cleanly.
      postgres:
        image: public.ecr.aws/docker/library/postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth" --health-interval 5s --health-timeout 3s --health-retries 10
      # Real Redis for the gateway's rate-limit store integration tests.
      redis:
        image: public.ecr.aws/docker/library/redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      # Real Kafka (single KRaft node) for the outbox → Kafka → consumer → DLQ tests.
      kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build
        env:
          TURBO_TELEMETRY_DISABLED: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          REDIS_URL: redis://localhost:6379
          # Real PostgreSQL for concurrency tests (overselling, deadlocks, SKIP LOCKED).
          TEST_DATABASE_URL: postgresql://auth:ci-only-password@localhost:5432/auth
          KAFKA_BROKERS: localhost:9092

      - name: Apply database migrations to PostgreSQL (one database per service)
        env:
          NODE_ENV: test
          PGPASSWORD: ci-only-password
        run: |
          for pair in auth-service:auth product-service:products inventory-service:inventory cart-service:cart order-service:orders payment-service:payments review-service:reviews notification-service:notifications admin-service:admin; do
            service="${pair%%:*}"; database="${pair##*:}"
            psql -h localhost -U auth -d auth -tc "SELECT 1 FROM pg_database WHERE datname = '$database'" | grep -q 1 \
              || psql -h localhost -U auth -d auth -c "CREATE DATABASE $database"
            DATABASE_URL="postgresql://auth:ci-only-password@localhost:5432/$database" \
              pnpm --filter "@market/$service" db:migrate
          done

      - name: Fail if a schema changed without a generated migration
        run: |
          for dir in apps/*/; do
            [ -f "$dir/drizzle.config.ts" ] || continue
            (cd "$dir" && pnpm exec drizzle-kit generate --name ci-check)
          done
          git diff --exit-code -- 'apps/*/drizzle' || (echo "Run pnpm db:generate and commit the migration" && exit 1)
          test -z "$(git status --porcelain -- 'apps/*/drizzle')" || (git status -- 'apps/*/drizzle' && exit 1)

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  helm:
    name: Helm chart (lint, unit tests, schema, best practices)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-tool
        with:
          url: https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          sha256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
          binary: helm
      - uses: ./.github/actions/install-tool
        with:
          url: https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          sha256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          binary: kubeconform
      - uses: ./.github/actions/install-tool
        with:
          url: https://github.com/stackrox/kube-linter/releases/download/v0.7.6/kube-linter-linux.tar.gz
          sha256: cb6128997162b8b7e6962284313635643434421b4e9b4f86545af7a4976e0139
          binary: kube-linter
      - name: helm-unittest plugin (pinned tag)
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3

      - name: Check the chart
        run: infrastructure/helm/check.sh

  terraform:
    name: Terraform (format, validate, tests, tflint, checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # checkov results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No AWS credentials: no backend, mock providers in the tests.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.59.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install checkov==3.3.23

      - name: Check the Terraform code
        env:
          # tflint --init downloads the AWS ruleset from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
          SARIF_DIR: ${{ github.workspace }}/.sarif
        run: infrastructure/terraform/check.sh

      - name: Publish checkov results to code scanning
        # Fork pull requests get a read-only token; their results stay in the job log.
        if: always() && hashFiles('.sarif/results_sarif.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: .sarif/results_sarif.sarif
          category: checkov

  security:
    name: Security (secrets, dependencies, static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # results to code scanning
    env:
      SARIF_DIR: ${{ github.workspace }}/.sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Whole history: a secret committed and later deleted is still leaked.
          fetch-depth: 0

      - uses: ./.github/actions/install-tool
        with:
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          binary: gitleaks
      - uses: ./.github/actions/install-tool
        with:
          url: https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz
          sha256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
          binary: trivy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.179.0

      - name: Secrets in the Git history (gitleaks)
        run: scripts/security-scan.sh secrets
      - name: Vulnerable dependencies with a fix available (Trivy, lockfile)
        if: always()
        run: scripts/security-scan.sh dependencies
      - name: Static analysis (Semgrep)
        if: always()
        run: scripts/security-scan.sh code

      - name: Publish gitleaks results to code scanning
        # Fork pull requests get a read-only token; their results stay in the job log.
        if: always() && hashFiles('.sarif/secrets.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: .sarif/secrets.sarif
          category: gitleaks

      - name: Publish trivy-lockfile results to code scanning
        # Fork pull requests get a read-only token; their results stay in the job log.
        if: always() && hashFiles('.sarif/dependencies.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: .sarif/dependencies.sarif
          category: trivy-lockfile

      - name: Publish semgrep results to code scanning
        # Fork pull requests get a read-only token; their results stay in the job log.
        if: always() && hashFiles('.sarif/code.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: .sarif/code.sarif
          category: semgrep

  observability:
    name: Observability (alert rules, collector, dashboards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tool
        with:
          url: https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz
          sha256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
          binary: promtool
      - name: Check the observability configuration
        run: infrastructure/observability/check.sh

  dependency-review:
    name: Dependency review (new vulnerabilities, licenses)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the dependency graph diff
      pull-requests: write # summary comment when the review fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      security-events: write # zizmor results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-tool
        with:
          url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          binary: actionlint
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install zizmor==1.30.1
      - run: actionlint
      - name: Workflow security (zizmor)
        run: |
          mkdir -p .sarif
          zizmor --offline --format sarif .github > "$GITHUB_WORKSPACE/.sarif/zizmor.sarif" || status=$?
          zizmor --offline .github
          exit "${status:-0}"

      - name: Publish zizmor results to code scanning
        # Fork pull requests get a read-only token; their results stay in the job log.
        if: always() && hashFiles('.sarif/zizmor.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: .sarif/zizmor.sarif
          category: zizmor

  # One stable name for branch protection ("CI passed"), whatever jobs are added later.
  passed:
    name: CI passed
    if: always()
    needs: [verify, helm, terraform, observability, security, workflows, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          # dependency-review runs on pull requests only; skipped elsewhere.
          for result in $RESULTS; do [ "$result" = success ] || [ "$result" = skipped ] || exit 1; done
