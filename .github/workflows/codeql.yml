name: CodeQL

# Semantic analysis with data flow (taint from requests to queries, redirects, file paths...)
# for the TypeScript code and for the workflows themselves. Results are alerts in the
# repository's Security tab and annotations on pull requests; the `security-extended` suite
# adds lower-precision security queries to the default set.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New queries find old bugs: re-analyse main weekly even without changes.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # Interpreted languages: analysed from source, no build step.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/.next'
              - '**/drizzle/**'

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
