# Dependency review: checks only what a pull request adds or changes in the lockfile.
fail-on-severity: high
# Development tools can be just as dangerous (they run in CI with tokens and in developers'
# shells), so every scope is checked.
fail-on-scopes: [runtime, development, unknown]
# Licenses a closed-source shop may ship or build with. Anything else needs a deliberate
# decision: add it here in the pull request that introduces the dependency.
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - ISC
  - BSD-2-Clause
  - BSD-3-Clause
  - 0BSD
  - BlueOak-1.0.0
  - Python-2.0
  - CC0-1.0
  - CC-BY-4.0 # data only (browserslist's caniuse-lite)
  - OFL-1.1 # fonts
  - Unlicense
  - MPL-2.0 # file-level copyleft, used unmodified (lightningcss)
  - LGPL-3.0-or-later # dynamically linked native library (sharp's libvips)
show-openssf-scorecard: true
warn-on-openssf-scorecard-level: 3
comment-summary-in-pr: on-failure
